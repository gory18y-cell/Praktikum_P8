<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matriks Kompetensi — TUMBUH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/app-shell.css">
  <link rel="stylesheet" href="css/pages.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div id="toast-container"></div>
<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script>
const currentUser = Auth.require();
if (!currentUser) throw new Error('Not authenticated');
</script>

<div id="shell-root"></div>

<script>
document.getElementById('shell-root').innerHTML = buildAppShell('competencies', currentUser);
setTimeout(() => { if (window.lucide) window.lucide.createIcons(); setupDropdowns(); }, 50);

// ── State
let cState = {
  selectedUserId: currentUser.role === 'admin' || currentUser.role === 'manager' ? 'u002' : currentUser.id,
  selectedCategory: 'all',
  radarChart: null,
};

function initCompetencies() {
  renderCompetenciesPage();
}

function renderCompetenciesPage() {
  const isManagerOrAdmin = currentUser.role === 'admin' || currentUser.role === 'manager';
  const allEmployees = DB.getUsers().filter(u => u.role !== 'admin');
  const targetUser = DB.getById('users', cState.selectedUserId) || currentUser;
  const assessments = DB.getCompetencyData(cState.selectedUserId);
  const allMasterCompetencies = DB.getAll('competencies');

  // Filter assessments
  let displayAssessments = assessments;
  if (cState.selectedCategory !== 'all') {
    displayAssessments = displayAssessments.filter(a => a.competency && a.competency.category === cState.selectedCategory);
  }

  // Calculate stats
  const totalCompetencies = displayAssessments.length;
  const avgCurrent = totalCompetencies > 0 ? (displayAssessments.reduce((sum, a) => sum + (a.score || 0), 0) / totalCompetencies).toFixed(1) : 0;
  const avgTarget = totalCompetencies > 0 ? (displayAssessments.reduce((sum, a) => sum + (a.target_score || 0), 0) / totalCompetencies).toFixed(1) : 0;
  const gap = (avgTarget - avgCurrent).toFixed(1);

  const main = document.getElementById('main-content');
  main.innerHTML = `
    ${breadcrumbHTML([{ label: 'TUMBUH', url: 'dashboard.html' }, { label: 'Kompetensi' }])}

    <div class="page-header">
      <div class="page-title-row">
        <div>
          <h1 class="page-title">Matriks & Evaluasi Kompetensi</h1>
          <p class="page-subtitle">Pemetaan kecakapan, analisis kesenjangan (gap analysis), dan rekomendasi pengembangan.</p>
        </div>
        <div class="page-actions">
          ${isManagerOrAdmin ? `
            <button class="btn btn-secondary btn-sm" onclick="openMasterCompetencyModal()">
              <i data-lucide="folder-plus" style="width:16px;height:16px"></i> Standar Kompetensi
            </button>
            <button class="btn btn-primary btn-sm" onclick="openAssessmentModal()">
              <i data-lucide="clipboard-check" style="width:16px;height:16px"></i> Beri Penilaian
            </button>
          ` : `
            <button class="btn btn-primary btn-sm" onclick="navigate('programs.html')">
              <i data-lucide="book-open" style="width:16px;height:16px"></i> Jelajahi Kursus Terkait
            </button>
          `}
        </div>
      </div>
    </div>

    <!-- Employee Selector & Category Filters -->
    <div class="filter-bar">
      ${isManagerOrAdmin ? `
        <div class="filter-group" style="flex:1;min-width:260px">
          <label class="filter-label"><i data-lucide="user" style="width:14px;height:14px"></i> Pegawai / Peserta:</label>
          <select class="filter-select" style="flex:1" onchange="handleSelectUser(this.value)">
            ${allEmployees.map(emp => `
              <option value="${emp.id}" ${emp.id === cState.selectedUserId ? 'selected' : ''}>
                ${emp.full_name} (${emp.position || emp.role})
              </option>
            `).join('')}
          </select>
        </div>
      ` : ''}

      <div class="filter-group">
        <label class="filter-label">Kategori:</label>
        <select class="filter-select" onchange="handleCategoryFilter(this.value)">
          <option value="all" ${cState.selectedCategory === 'all' ? 'selected' : ''}>Semua Kategori</option>
          <option value="Teknikal" ${cState.selectedCategory === 'Teknikal' ? 'selected' : ''}>Teknikal</option>
          <option value="Soft Skill" ${cState.selectedCategory === 'Soft Skill' ? 'selected' : ''}>Soft Skill</option>
          <option value="Manajerial" ${cState.selectedCategory === 'Manajerial' ? 'selected' : ''}>Manajerial</option>
        </select>
      </div>

      <div style="font-size:var(--text-xs);color:var(--body);margin-left:auto">
        Menampilkan data evaluasi <strong>${targetUser.full_name}</strong>
      </div>
    </div>

    <!-- Quick Stat Cards -->
    <div class="stats-row" style="margin-bottom: var(--space-6);">
      <div class="stat-card">
        <div class="stat-icon" style="background:var(--mint)">
          <i data-lucide="award" style="width:20px;height:20px;color:var(--primary)"></i>
        </div>
        <div>
          <div class="stat-value">${avgCurrent} / 5.0</div>
          <div class="stat-label">Rata-rata Skor Saat Ini</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:var(--blue-accent)">
          <i data-lucide="target" style="width:20px;height:20px;color:#1E5FAD"></i>
        </div>
        <div>
          <div class="stat-value">${avgTarget} / 5.0</div>
          <div class="stat-label">Target Organisasi</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:${gap > 0 ? '#FFF0C9' : 'var(--mint)'}">
          <i data-lucide="trending-up" style="width:20px;height:20px;color:${gap > 0 ? 'var(--warning)' : 'var(--primary)'}"></i>
        </div>
        <div>
          <div class="stat-value">${gap > 0 ? `-${gap}` : 'Tercapai'}</div>
          <div class="stat-label">Kesenjangan Rata-rata</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:var(--lavender-accent)">
          <i data-lucide="check-circle-2" style="width:20px;height:20px;color:#5B3FBF"></i>
        </div>
        <div>
          <div class="stat-value">${displayAssessments.length}</div>
          <div class="stat-label">Kompetensi Terpetakan</div>
        </div>
      </div>
    </div>

    <!-- Main Grid: Radar Chart + Detailed Competency List -->
    <div class="dashboard-grid">
      <!-- Left Column: Competency Breakdown List -->
      <div class="dashboard-col-left">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-4)">
            <div>
              <h3 class="text-base font-bold" style="color:var(--heading)">Analisis Kompetensi Individu</h3>
              <p class="text-xs text-muted">Bandingkan skor riil terhadap target profil jabatan</p>
            </div>
            ${isManagerOrAdmin ? `
              <button class="btn btn-secondary btn-sm" onclick="openAssessmentModal('${cState.selectedUserId}')">
                <i data-lucide="edit-3" style="width:14px;height:14px"></i> Perbarui Skor
              </button>
            ` : ''}
          </div>

          <div class="competency-list-wrap">
            ${displayAssessments.length === 0 ? `
              <div class="empty-state">
                <p>Belum ada evaluasi kompetensi untuk pegawai ini.</p>
                ${isManagerOrAdmin ? `<button class="btn btn-primary btn-sm" onclick="openAssessmentModal('${cState.selectedUserId}')">Mulai Penilaian Sekarang</button>` : ''}
              </div>
            ` : displayAssessments.map(a => {
              const comp = a.competency || { name: 'Kompetensi', category: 'Umum' };
              const currentPct = (a.score / 5) * 100;
              const targetPct = (a.target_score / 5) * 100;
              const isMet = a.score >= a.target_score;

              return `
                <div class="card" style="padding:14px;background:var(--ivory);border:1px solid var(--border);margin-bottom:12px">
                  <div class="competency-bar-header">
                    <div>
                      <span class="competency-bar-label">${comp.name}</span>
                      <span class="badge ${comp.category === 'Teknikal' ? 'badge-blue' : comp.category === 'Soft Skill' ? 'badge-green' : 'badge-lavender'}" style="margin-left:6px;font-size:10px">${comp.category}</span>
                    </div>
                    <div class="competency-bar-scores">
                      <span class="competency-bar-current">Skor: ${a.score}</span>
                      <span class="competency-bar-target">/ Target: ${a.target_score}</span>
                      ${isMet ? `<span class="badge badge-green" style="font-size:10px">Kompeten</span>` : `<span class="badge badge-yellow" style="font-size:10px">Perlu Pelatihan</span>`}
                    </div>
                  </div>

                  <!-- Visual Progress Track with target notch -->
                  <div class="competency-bar-track" style="margin: 8px 0 10px 0">
                    <div class="competency-bar-fill" style="width:${currentPct}%;background:${isMet ? 'var(--primary)' : 'var(--warning)'}"></div>
                    <div class="competency-bar-target-mark" style="left:${targetPct}%;" title="Target: ${a.target_score}"></div>
                  </div>

                  <!-- Evaluator notes & recommended course -->
                  <div style="font-size:12px;color:var(--body);line-height:1.5;background:var(--surface);padding:8px 12px;border-radius:var(--radius-sm)">
                    <strong>Catatan Evaluator:</strong> ${a.notes || 'Tidak ada catatan khusus.'}
                    <div style="font-size:11px;color:var(--muted);margin-top:4px">
                      Dinilai oleh <strong>${a.evaluator ? a.evaluator.full_name : 'Pimpinan'}</strong> pada ${formatDate(a.assessed_at)}
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      </div>

      <!-- Right Column: Radar Chart & Rubric Legend -->
      <div class="dashboard-col-right">
        <!-- Radar Chart Card -->
        <div class="card">
          <h3 class="text-base font-bold" style="color:var(--heading);margin-bottom:var(--space-2)">Grafik Radar Kompetensi</h3>
          <p class="text-xs text-muted" style="margin-bottom:var(--space-4)">Visualisasi profil kekuatan & kesenjangan</p>
          <div style="position:relative;height:300px;width:100%;display:flex;align-items:center;justify-content:center">
            <canvas id="competency-radar-chart"></canvas>
          </div>
        </div>

        <!-- Rubric Level Standard -->
        <div class="card">
          <h4 class="text-sm font-bold" style="color:var(--heading);margin-bottom:var(--space-3)">Pedoman Tingkat Kemahiran</h4>
          <div style="display:flex;flex-direction:column;gap:8px;font-size:12px">
            <div style="display:flex;gap:8px;align-items:flex-start">
              <span class="badge badge-gray" style="width:24px;text-align:center">1</span>
              <div><strong>Dasar / Pemula:</strong> Memahami konsep dasar dengan supervisi ketat.</div>
            </div>
            <div style="display:flex;gap:8px;align-items:flex-start">
              <span class="badge badge-gray" style="width:24px;text-align:center">2</span>
              <div><strong>Berkembang:</strong> Mampu menerapkan keterampilan pada tugas rutin.</div>
            </div>
            <div style="display:flex;gap:8px;align-items:flex-start">
              <span class="badge badge-green" style="width:24px;text-align:center">3</span>
              <div><strong>Kompeten:</strong> Mampu bekerja mandiri dengan hasil konsisten.</div>
            </div>
            <div style="display:flex;gap:8px;align-items:flex-start">
              <span class="badge badge-blue" style="width:24px;text-align:center">4</span>
              <div><strong>Mahir:</strong> Mampu membimbing orang lain dan menangani kasus kompleks.</div>
            </div>
            <div style="display:flex;gap:8px;align-items:flex-start">
              <span class="badge badge-lavender" style="width:24px;text-align:center">5</span>
              <div><strong>Ahli / Master:</strong> Diakui sebagai rujukan ahli dan mampu merancang strategi baru.</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modals Container -->
    <div id="assessment-modal-container"></div>
    <div id="master-comp-modal-container"></div>
  `;

  if (window.lucide) window.lucide.createIcons();
  buildRadarChart(displayAssessments);
}

function handleSelectUser(userId) {
  cState.selectedUserId = userId;
  renderCompetenciesPage();
}

function handleCategoryFilter(cat) {
  cState.selectedCategory = cat;
  renderCompetenciesPage();
}

function buildRadarChart(assessments) {
  const canvas = document.getElementById('competency-radar-chart');
  if (!canvas) return;

  if (cState.radarChart) {
    cState.radarChart.destroy();
  }

  const labels = assessments.map(a => a.competency ? a.competency.name : 'Kompetensi');
  const scores = assessments.map(a => a.score);
  const targets = assessments.map(a => a.target_score);

  const ctx = canvas.getContext('2d');
  cState.radarChart = new Chart(ctx, {
    type: 'radar',
    data: {
      labels: labels.length > 0 ? labels : ['Analisis Data', 'Komunikasi', 'Kepemimpinan', 'Literasi Digital', 'Kolaborasi', 'Problem Solving'],
      datasets: [
        {
          label: 'Skor Saat Ini',
          data: scores.length > 0 ? scores : [4, 3, 4, 5, 4, 3],
          backgroundColor: 'rgba(8, 107, 80, 0.2)',
          borderColor: '#086B50',
          pointBackgroundColor: '#086B50',
          pointBorderColor: '#fff',
          borderWidth: 2,
        },
        {
          label: 'Target Jabatan',
          data: targets.length > 0 ? targets : [5, 4, 5, 5, 4, 4],
          backgroundColor: 'rgba(214, 154, 36, 0.1)',
          borderColor: '#D69A24',
          borderDash: [4, 4],
          pointBackgroundColor: '#D69A24',
          pointBorderColor: '#fff',
          borderWidth: 1.5,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        r: {
          min: 0,
          max: 5,
          ticks: {
            stepSize: 1,
            backdropColor: 'transparent',
            font: { size: 10 }
          },
          grid: {
            color: 'rgba(0,0,0,0.06)'
          },
          pointLabels: {
            font: { size: 11, weight: '600', family: "'Plus Jakarta Sans', sans-serif" },
            color: '#1A2923'
          }
        }
      },
      plugins: {
        legend: {
          position: 'bottom',
          labels: {
            boxWidth: 12,
            font: { size: 11, family: "'Plus Jakarta Sans', sans-serif" }
          }
        }
      }
    }
  });
}

// ── Open Assessment Modal
function openAssessmentModal(userId = null) {
  const allUsers = DB.getUsers().filter(u => u.role !== 'admin');
  const allCompetencies = DB.getAll('competencies');
  const targetId = userId || cState.selectedUserId || (allUsers[0] ? allUsers[0].id : '');
  const container = document.getElementById('assessment-modal-container');

  container.innerHTML = `
    <div class="modal-overlay" id="assessment-modal">
      <div class="modal modal-md">
        <div class="modal-header">
          <h3 class="text-lg font-bold">Evaluasi & Penilaian Kompetensi</h3>
          <button class="btn btn-ghost btn-icon" onclick="closeModal('assessment-modal')">
            <i data-lucide="x" style="width:18px;height:18px"></i>
          </button>
        </div>
        <form onsubmit="handleSaveAssessment(event)">
          <div class="modal-body">
            <div class="form-group" style="margin-bottom:14px">
              <label class="form-label">Pegawai yang Dinilai <span class="required">*</span></label>
              <select class="form-input" id="eval-user-id" required>
                ${allUsers.map(u => `
                  <option value="${u.id}" ${u.id === targetId ? 'selected' : ''}>
                    ${u.full_name} (${u.position || u.role})
                  </option>
                `).join('')}
              </select>
            </div>

            <div class="form-group" style="margin-bottom:14px">
              <label class="form-label">Standar Kompetensi <span class="required">*</span></label>
              <select class="form-input" id="eval-comp-id" required>
                ${allCompetencies.map(c => `
                  <option value="${c.id}">${c.name} [${c.category}]</option>
                `).join('')}
              </select>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
              <div class="form-group">
                <label class="form-label">Skor Riil Saat Ini (1 - 5) <span class="required">*</span></label>
                <select class="form-input" id="eval-score" required>
                  <option value="1">1 — Dasar / Pemula</option>
                  <option value="2">2 — Berkembang</option>
                  <option value="3" selected>3 — Kompeten</option>
                  <option value="4">4 — Mahir</option>
                  <option value="5">5 — Ahli / Master</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Skor Target Jabatan (1 - 5) <span class="required">*</span></label>
                <select class="form-input" id="eval-target-score" required>
                  <option value="1">1 — Dasar</option>
                  <option value="2">2 — Berkembang</option>
                  <option value="3">3 — Kompeten</option>
                  <option value="4" selected>4 — Mahir</option>
                  <option value="5">5 — Ahli / Master</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Catatan Evaluator & Rekomendasi <span class="required">*</span></label>
              <textarea class="form-input" id="eval-notes" rows="3" required placeholder="Tuliskan bukti kinerja, kekuatan, dan area yang memerlukan pelatihan pendukung..."></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="closeModal('assessment-modal')">Batal</button>
            <button type="submit" class="btn btn-primary">Simpan Penilaian</button>
          </div>
        </form>
      </div>
    </div>
  `;

  openModal('assessment-modal');
  if (window.lucide) window.lucide.createIcons();
}

function handleSaveAssessment(e) {
  e.preventDefault();
  const userId = document.getElementById('eval-user-id').value;
  const compId = document.getElementById('eval-comp-id').value;
  const score = parseInt(document.getElementById('eval-score').value, 10);
  const targetScore = parseInt(document.getElementById('eval-target-score').value, 10);
  const notes = document.getElementById('eval-notes').value.trim();

  DB.saveAssessment({
    user_id: userId,
    competency_id: compId,
    score: score,
    target_score: targetScore,
    notes: notes,
    evaluator_id: currentUser.id,
  });

  // Also push notification to evaluated employee
  const comp = DB.getById('competencies', compId);
  DB.insert('notifications', {
    id: DB.generateId('n'),
    user_id: userId,
    title: 'Pembaruan Skor Kompetensi',
    message: `Evaluasi kompetensi ${comp ? comp.name : ''} Anda telah diperbarui oleh ${currentUser.full_name}.`,
    category: 'evaluasi',
    related_url: '/competencies',
    read_at: null,
    created_at: new Date().toISOString()
  });

  showToast('Penilaian kompetensi berhasil disimpan!', 'success');
  closeModal('assessment-modal');
  cState.selectedUserId = userId;
  renderCompetenciesPage();
}

// ── Open Master Competency Definition Modal
function openMasterCompetencyModal() {
  const container = document.getElementById('master-comp-modal-container');
  container.innerHTML = `
    <div class="modal-overlay" id="master-comp-modal">
      <div class="modal modal-md">
        <div class="modal-header">
          <h3 class="text-lg font-bold">Tambah Standar Kompetensi Baru</h3>
          <button class="btn btn-ghost btn-icon" onclick="closeModal('master-comp-modal')">
            <i data-lucide="x" style="width:18px;height:18px"></i>
          </button>
        </div>
        <form onsubmit="handleSaveMasterCompetency(event)">
          <div class="modal-body">
            <div class="form-group" style="margin-bottom:14px">
              <label class="form-label">Nama Kompetensi <span class="required">*</span></label>
              <input type="text" class="form-input" id="mc-name" required placeholder="Contoh: Cloud Computing Architecture">
            </div>

            <div class="form-group" style="margin-bottom:14px">
              <label class="form-label">Kelompok Kategori <span class="required">*</span></label>
              <select class="form-input" id="mc-cat" required>
                <option value="Teknikal">Teknikal</option>
                <option value="Soft Skill">Soft Skill</option>
                <option value="Manajerial">Manajerial</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Deskripsi & Indikator Perilaku <span class="required">*</span></label>
              <textarea class="form-input" id="mc-desc" rows="3" required placeholder="Deskripsikan keterampilan dan indikator yang diharapkan..."></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="closeModal('master-comp-modal')">Batal</button>
            <button type="submit" class="btn btn-primary">Simpan Standar</button>
          </div>
        </form>
      </div>
    </div>
  `;

  openModal('master-comp-modal');
  if (window.lucide) window.lucide.createIcons();
}

function handleSaveMasterCompetency(e) {
  e.preventDefault();
  const newComp = {
    id: DB.generateId('c'),
    name: document.getElementById('mc-name').value.trim(),
    category: document.getElementById('mc-cat').value,
    description: document.getElementById('mc-desc').value.trim(),
  };

  DB.insert('competencies', newComp);
  showToast('Standar kompetensi baru berhasil ditambahkan!', 'success');
  closeModal('master-comp-modal');
  renderCompetenciesPage();
}

// ── Startup
document.addEventListener('DOMContentLoaded', () => {
  initCompetencies();
});
</script>
</body>
</html>
