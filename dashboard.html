function renderParticipationChart() {
  const trend = DB.data.participation_trend;
  renderLineChart('participation-chart',
    trend.map(t => t.month),
    [{
      label: 'Partisipasi',
      data: trend.map(t => t.value),
      borderColor: '#086B50',
      backgroundColor: 'rgba(8,107,80,.08)',
      fill: true,
    }]
  );
}

function updateTrendChart(months) {
  // Destroy and re-render with different slice
  const ctx = document.getElementById('participation-chart');
  if (ctx && ctx.chart) ctx.chart.destroy();
  const trend = DB.data.participation_trend.slice(-parseInt(months));
  renderLineChart('participation-chart',
    trend.map(t => t.month),
    [{ label: 'Partisipasi', data: trend.map(t => t.value), borderColor: '#086B50', backgroundColor: 'rgba(8,107,80,.08)', fill: true }]
  );
}

function renderCompetencyDoughnut() {
  const comps = DB.getAll('competencies');
  const assessments = DB.getAll('competency_assessments');
  const labels = comps.map(c => c.name);
  const values = comps.map(c => {
    const compAssessments = assessments.filter(a => a.competency_id === c.id);
    if (!compAssessments.length) return 0;
    return Math.round(compAssessments.reduce((s, a) => s + (a.score/5)*100, 0) / compAssessments.length);
  });
  const colors = ['#086B50','#15966F','#1E5FAD','#5B3FBF','#D69A24','#17865D','#D95757'];
  renderDoughnutChart('competency-chart', labels, values, colors);
}

function renderCompletionBar() {
  const cats = ['Data Analytics','Leadership Development','Digital Literacy','Professional Skills'];
  const values = cats.map(cat => {
    const programs = DB.getPrograms({ category: cat });
    const enrollments = DB.getAll('enrollments').filter(e => programs.some(p => p.id === e.program_id));
    if (!enrollments.length) return 0;
    return Math.round(enrollments.filter(e => e.status === 'Selesai').length / enrollments.length * 100);
  });
  renderBarChart('completion-chart', cats.map(c => c.split(' ')[0]), values, '#086B50', 'Tingkat Penyelesaian (%)');
}

}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function getGreeting() {
  const h = new Date().getHours();
  if (h < 11) return 'pagi';
  if (h < 15) return 'siang';
  if (h < 18) return 'sore';
  return 'malam';
}

// (downloadCertificate is handled globally via js/utils.js)

// ─── Init ─────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  renderDashboard();
  setTimeout(() => { if (window.lucide) window.lucide.createIcons(); setupDropdowns(); }, 200);
});
